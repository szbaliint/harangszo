<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<!-- Defence in depth: no inline event-handler attributes, no plugins, no <base> rewriting. -->
<meta http-equiv="Content-Security-Policy" content="script-src-attr 'none'; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Harangszó plébániáknak</title>
<meta name="theme-color" content="#13233f">
<meta name="theme-color" content="#13233f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/bell.svg" type="image/svg+xml">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}</style>
<link rel="stylesheet" href="styles.css">
<style>
/* Parish portal: one church at a time, phone first, in the Indulások world: a navy header (the brand and the account,
   the screen's title or the church's name and state, on phones the Szerkesztés / Így látják a hívek switch) over a
   white work area of hairline rows. Shared parts (ui-*, the week board se-*, the photo cp-*, the amber save bar) come
   from styles.css; only this page's layout lives here. Below 980px the four sections are a tab bar at the bottom
   (line icons over labels, as on the map) and the preview is the switch; from 980px the tabs sit in the navy header
   and the preview is a column on the right. Unsaved changes: a changed card is held in pale amber (.chg) and its
   section's tab carries an amber dot until the save. */
html,body{height:auto}
body{overflow:auto}
.pp{min-height:100%}

/* Header: the board */
.pp-top{background:var(--board);color:var(--on-board)}
.pp-in{max-width:1160px;margin:0 auto;padding:calc(6px + env(safe-area-inset-top,0px)) 20px 20px}
.pp-bar{display:flex;align-items:center;gap:8px 12px;min-height:52px}
.pp-brand{flex:none;display:inline-flex;align-items:baseline;gap:7px;padding:12px 0;color:var(--on-board);font:800 var(--fs-3)/1.2 var(--f-display);text-decoration:none}
.pp-brand span{font:700 var(--fs-1)/1.2 var(--f-body);color:var(--on-board-2)}
.pp-who{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
.pp-who .em{min-width:0;margin-right:4px;font:600 var(--fs-1)/1.3 var(--f-body);color:var(--on-board-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-who .bbtn{padding:0 14px;text-decoration:none}
@media (max-width:639.98px){.pp-who .em{display:none}}
.pp-name,.pp-title{margin:12px 0 0;font:800 var(--fs-title)/1.12 var(--f-display);letter-spacing:-.01em;color:var(--on-board);text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}
.pp-state{margin:6px 0 0;font:600 14px/1.35 var(--f-body);color:var(--on-board-2)}
.pp-top .ui-seg{margin-top:16px;background:var(--board-2)}
.pp-top .ui-seg button{color:var(--on-board-3)}
.pp-top .ui-seg button[aria-pressed="true"]{background:#ffffff;color:#14213d;box-shadow:none}
.pp-top :focus-visible{outline-color:var(--amber)}

/* Sections. Phones: a tab bar at the bottom as on the map (white, line icons over 12px labels, the open one in ink;
   an amber dot by the icon when the section holds unsaved changes). */
.ui-tabbar.pp-tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;height:var(--tabbar-h);padding:0 8px env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);border-bottom:0;background:var(--bg)}
.pp-tabs .ui-tab{flex-direction:column;gap:5px;padding:0;color:var(--ink-3);font:700 var(--fs-0)/1 var(--f-body);box-shadow:none}
.pp-tabs .ui-tab svg{flex:none;width:24px;height:24px}
.pp-tabs .ui-tab[aria-pressed="true"]{color:var(--ink);box-shadow:none}
.pp-tabs .ui-tab.chg::after{position:absolute;top:8px;left:calc(50% + 9px)}
.pp-tabs :focus-visible{outline-color:var(--ink)}
.pp-mode{margin:0}

/* The work area */
.pp-wrap{max-width:1160px;margin:0 auto;padding:22px 20px calc(var(--tabbar-h) + 96px)}
.pp-cols{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media (max-width:979.98px){
  .pp-cols[data-mode="edit"] .pp-pv{display:none}
  .pp-cols[data-mode="preview"] .pp-sec{display:none}
  .ui-savebar.pp-bar{bottom:calc(var(--tabbar-h) + 10px)}
  .ui-toast{bottom:calc(var(--tabbar-h) + 72px)}}
@media (min-width:980px){
  .pp-in{padding-bottom:0}
  .ui-tabbar.pp-tabs{position:static;height:auto;margin:18px 0 0;padding:0 0 14px;gap:4px;border:0;background:transparent;justify-content:flex-start}
  .pp-tabs .ui-tab{flex:none;flex-direction:row;gap:8px;padding:0 16px 0 13px;border-radius:10px;color:var(--on-board-2);font-size:14px;
    transition:background-color .2s var(--ease),color .2s var(--ease)}
  .pp-tabs .ui-tab svg{width:18px;height:18px}
  .pp-tabs .ui-tab[aria-pressed="true"]{background:var(--board-2);color:#ffffff}
  .pp-tabs .ui-tab.chg::after{position:static;box-shadow:none}
  .pp-tabs :focus-visible{outline-color:var(--amber)}
  @media (hover:hover){.pp-tabs .ui-tab:hover:not([aria-pressed="true"]){color:#ffffff}}
  .pp-wrap{padding:32px 20px 120px}
  .pp-mode{display:none}
  .pp-cols{grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start}
  .pp-pv{position:sticky;top:24px}}

/* Section content: hairline rows (cards bleed 12px past the text so a pale amber row never sits on it) */
.pp-lead{margin:0 0 18px;max-width:62ch;color:var(--ink-2);font-size:var(--fs-2);line-height:1.5}
.pp-notice{margin:0 0 22px;max-width:78ch;padding:14px 16px;border-radius:var(--r);background:var(--sunken);color:var(--ink);font-size:var(--fs-2);line-height:1.5}
.pp-list{display:grid}
.pp-card{display:grid;gap:12px;min-width:0;margin:0 -12px;padding:16px 12px 18px;border-bottom:1px solid var(--line)}
.pp-list>:first-child{border-top:1px solid var(--line)}
.pp-card.chg{background:var(--flash)}
.pp-card h3{margin:0;font:800 var(--fs-3)/1.25 var(--f-display);color:var(--ink);overflow-wrap:anywhere}
.pp-card .when{display:block;margin-top:3px;color:var(--ink-2);font:600 var(--fs-1)/1.35 var(--f-body)}
.pp-line{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.pp-line .ui-field{flex:1 1 140px}
.pp-line .ui-field.t{flex:0 1 128px}
.pp-line .ui-field.d{flex:0 0 168px}
.pp-line .ui-field.wide{flex:3 1 220px}
.pp-rows{display:grid}
.pp-rows>.pp-line{padding:12px 0;border-top:1px solid var(--line)}
.pp-rows>.pp-line:first-child{padding-top:0;border-top:0}
.pp-add{justify-self:start}
.pp-list>.pp-add{margin-top:16px}
.pp-check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:var(--fs-2);color:var(--ink);cursor:pointer}
.pp-hours{display:grid;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pp-hours .pp-line .ui-field{flex:0 1 128px}
.pp-hours .ui-daypick{max-width:440px}
.pp-card>.ui-seg{max-width:460px}
.pp-card>.ui-seg button{padding:0 6px}
.pp-muted{margin:0;color:var(--ink-2);font:600 var(--fs-1)/1.45 var(--f-body)}
.pp-list>.pp-muted{margin:0 -12px;padding:14px 12px;border-bottom:1px solid var(--line)}
.pp-past{margin-top:14px}

/* What the faithful will see: the next seven days as a board */
.pp-pv{min-width:0}
.pp-pv h2{margin:0;font:800 var(--fs-4)/1.2 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
.pv-sub{margin:4px 0 16px;color:var(--ink-2);font:600 var(--fs-1)/1.4 var(--f-body)}
.pv-note{margin:0 0 14px;padding:10px 12px;border-radius:var(--r);background:var(--flash);color:var(--ink);font:600 var(--fs-1)/1.4 var(--f-body)}
.pv-cols,.ui-row.pv-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px}
.pv-cols{margin:0 -10px;padding:0 10px 6px;border-bottom:1px solid var(--line);font:700 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.ui-glist.pv-list{border:0;background:transparent}
.pv-list>.pv-row:last-child{border-bottom:1px solid var(--line)}
.ui-row.pv-row{align-items:baseline;margin:0 -10px;padding:12px 10px}
.pv-row.today{background:var(--sunken)}
.pv-row .d{color:var(--ink-2);font:600 var(--fs-1)/1.35 var(--f-body)}
.pv-row .d b{display:block;color:var(--ink);font:700 var(--fs-2)/1.3 var(--f-body)}
.pv-row .t{min-width:0;color:var(--ink-2);font:600 var(--fs-2)/1.45 var(--f-body)}
.pv-row .t b{font-weight:800;color:var(--ink)}
.pv-row .f{display:block;margin-top:2px;color:var(--ink-2);font:600 var(--fs-1)/1.35 var(--f-body)}
.pv-row .none{color:var(--ink-3)}
.pv-map{margin-top:18px}
@media (max-width:979.98px){.pp-pv h2{display:none}}

/* Sign-in, choosing a church, asking for access: one plain column under the header's title */
.pp-narrow{max-width:440px;margin:0 auto;display:grid;gap:16px}
.pp-narrow h2{margin:6px 0 0;font:800 var(--fs-3)/1.3 var(--f-display);color:var(--ink)}
.pp-narrow .pp-lead{margin:0}
.pp-msg{margin:0;font:600 var(--fs-2)/1.4 var(--f-body)}
.pp-msg:empty{display:none}
.pp-msg.ok{color:var(--ink)} .pp-msg.err{color:var(--closed)}
.pp-links{display:flex;flex-wrap:wrap;gap:2px;margin:-6px -10px 0}
.pp-links .ui-btn{padding:0 10px}
.pp-results{max-height:50vh;overflow:auto}
.pp-results:empty{display:none}
.pp-results .ui-row,.pp-req{position:relative;display:grid;gap:2px;justify-items:start}
.pp-results .ui-row{padding:11px 40px 11px 12px}
.pp-results .ui-row b,.pp-req b{font:800 var(--fs-2)/1.3 var(--f-display);overflow-wrap:anywhere}
.pp-results .ui-row small{color:var(--ink-2);font:600 var(--fs-1)/1.3 var(--f-body)}
.pp-results .ui-row[aria-pressed="true"]{background:var(--sunken)}
.pp-results .ck{display:none;position:absolute;right:12px;top:50%;margin-top:-10px;color:var(--ink)}
.pp-results .ui-row[aria-pressed="true"] .ck{display:block}
@media (hover:hover){.pp-results button.ui-row:hover{background:var(--sunken)}}
.pp-results .ui-row:first-child{border-top:0}
.pp-reqs{display:grid;gap:8px}
.pp-form{display:grid;gap:16px;padding-top:4px}
.pp-legal{margin:0;font-size:var(--fs-1);line-height:1.45;color:var(--ink-2)}
.pp-legal a{color:var(--ink-2);font-weight:600}
</style>
</head>
<body>
<div class="pp">
  <header class="pp-top" id="top"></header>
  <main class="pp-wrap" id="main"><p class="pp-muted">Betöltés…</p></main>
</div>
<div class="ui-savebar pp-bar" id="savebar" role="region" aria-label="Mentés">
  <span id="savestate" aria-live="polite"></span>
  <button class="ui-btn quiet" id="pv-go" type="button">Előnézet</button>
  <button class="ui-btn" id="save" type="button">Mentés</button>
  <p class="pp-err" id="saveerr" role="alert" hidden></p>
</div>
<div class="ui-toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="calendar.js"></script>
<script src="schedule-editor.js"></script>
<script src="church-photo.js"></script>
<script src="plebania.js"></script>
</body>
</html>
