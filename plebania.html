<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Harangszó plébániáknak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}</style>
<link rel="stylesheet" href="styles.css">
<style>
/* Parish portal: one church at a time, phone first. Shared parts (ui-*, the week board se-*) come from styles.css;
   only this page's layout lives here. Below 980px the sections sit in a floating tab bar at the bottom and the
   preview is a switch; from 980px the tab bar sits under the header and the preview is a column on the right. */
body{overflow:auto;font-size:16px}
.pp{min-height:100%}

/* Header: brand on the sign-in screens, the church on the editor */
.pp-top{max-width:1160px;margin:0 auto;padding:18px 16px 14px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 20px}
.pp-brand{display:inline-flex;align-items:baseline;min-height:44px;padding-top:9px;font:700 19px/1.2 var(--f-display);color:var(--ink);text-decoration:none}
.pp-brand small{margin-left:8px;font:600 13px/1.2 var(--f-body);color:var(--ink-3)}
.pp-head{flex:1 1 320px;min-width:0;display:grid;gap:4px}
.pp-kicker{font:600 12px/1.3 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.pp-name{margin:0;font:600 25px/1.12 var(--f-display);color:var(--ink);text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}
.pp-state{margin:2px 0 0;display:flex;align-items:baseline;gap:7px;font-size:14px;line-height:1.35;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pp-state i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--open);transform:translateY(-1px)}
.pp-state.off i{background:var(--ink-3)}
.pp-who{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin-left:auto;font-size:14px;color:var(--ink-2)}
.pp-who .em{margin-right:6px;overflow-wrap:anywhere}
.pp-who .ui-btn{padding:0 10px;font-weight:600}
@media (min-width:980px){.pp-name{font-size:28px}.pp-top.church .pp-who{padding-top:18px}}
@media (max-width:979.98px){.pp-top.church .pp-who{flex-basis:100%;margin:-4px 0 0 -10px}.pp-top.church .pp-who .em{margin-left:10px}}

/* Page body, section tabs, the phone's edit / preview switch */
.pp-wrap{max-width:1160px;margin:0 auto;padding:4px 16px calc(176px + env(safe-area-inset-bottom,0px))}
/* Phones: content scrolls under the floating tab bar; a soft fade below it keeps the bottom edge clean. */
body:has(.pp-tabs:not([hidden]))::after{content:"";position:fixed;left:0;right:0;bottom:0;z-index:29;height:calc(84px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 55%)}
@media (min-width:980px){body::after{display:none}}
.pp-tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;max-width:620px;margin:0 auto}
.pp-mode{margin:0 0 16px}
.pp-cols{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (max-width:979.98px){
  .pp-cols[data-mode="edit"] .pp-pv{display:none}
  .pp-cols[data-mode="preview"] .pp-sec{display:none}
  .ui-savebar.pp-bar{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
@media (min-width:980px){
  .pp-wrap{padding-bottom:110px}
  .pp-tabs{position:static;max-width:560px;margin:0 0 22px;background:var(--surface);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .pp-mode{display:none}
  .pp-cols{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .pp-pv{position:sticky;top:16px}}

/* Section content */
.pp-lead{margin:0 0 14px;max-width:62ch;color:var(--ink-2);font-size:15px;line-height:1.45}
.pp-notice{margin:0 0 16px;max-width:78ch;padding:12px 14px;border-radius:14px;background:var(--gold-soft);color:var(--ink);font-size:15px;line-height:1.45}
.pp-list{display:grid;gap:10px}
.pp-card{display:grid;gap:12px}
.pp-card h3{margin:0;font:600 19px/1.2 var(--f-display);color:var(--ink)}
.pp-card .when{display:block;margin-top:2px;color:var(--ink-3);font-size:13.5px;font-variant-numeric:tabular-nums}
.pp-line{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.pp-line .ui-field{flex:1 1 140px}
.pp-line .ui-field.t{flex:0 1 128px}
.pp-line .ui-field.d{flex:0 0 168px}
.pp-line .ui-field.wide{flex:3 1 220px}
.pp-rows{display:grid}
.pp-rows>.pp-line{padding:12px 0;border-top:1px solid var(--line)}
.pp-rows>.pp-line:first-child{padding-top:0;border-top:0}
.pp-add{justify-self:start}
.pp-card>.ui-seg button{padding:0 6px;line-height:1.15}
.pp-check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;color:var(--ink);cursor:pointer}
.pp-hours{display:grid;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pp-hours .pp-line .ui-field{flex:0 1 128px}
.pp-muted{margin:0;color:var(--ink-3);font-size:14px}

/* What the faithful will see */
.pp-pv{min-width:0}
.pp-pv h2{margin:0 0 6px;font:600 21px/1.2 var(--f-display);color:var(--ink)}
.pv-kicker{margin:0 0 8px;font:600 12px/1.3 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.pv-note{margin:-2px 0 10px;color:var(--ink-3);font-size:13.5px}
.ui-row.pv-row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;align-items:start}
.pv-row .d{color:var(--ink-3);font-size:13px}
.pv-row .d b{display:block;color:var(--ink);font-size:14.5px;font-weight:600}
.pv-row .f{display:block;margin-top:2px;color:var(--gold);font-size:12.5px}
.pv-row .none{color:var(--ink-3)}
.pv-map{margin-top:12px}
@media (max-width:979.98px){.pp-pv h2{display:none}}

/* Sign-in, choosing a church, asking for access */
.pp-narrow{max-width:440px;margin:16px auto;display:grid;gap:14px}
.pp-narrow.ui-card{padding:22px 20px}
.pp-title{margin:0;font:600 28px/1.15 var(--f-display);color:var(--ink);text-wrap:balance}
.pp-narrow h2{margin:0;font:600 20px/1.2 var(--f-display)}
.pp-msg{margin:0;font-size:14.5px}
.pp-msg:empty{display:none}
.pp-msg.ok{color:var(--open)} .pp-msg.err{color:var(--closed)}
.pp-links{display:flex;flex-wrap:wrap;gap:2px;margin:0 -10px}
.pp-links .ui-btn{padding:0 10px;font-weight:600}
.pp-results{max-height:50vh;overflow:auto}
.pp-results:empty{display:none}
.pp-results .ui-row{display:grid;gap:1px;justify-items:start}
.pp-results .ui-row small{color:var(--ink-3);font-size:13px}
.pp-results .ui-row[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pp-results .ui-row:first-child{border-top:0}
.pp-req{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px}
.pp-req .muted{font-size:13.5px}

/* Save bar: the error line above the count; light red on the dark bar, dark red on the light bar of dark mode */
.ui-savebar.pp-bar{flex-wrap:wrap}
.pp-err{flex:1 0 100%;order:-1;margin:0 0 4px;color:#f4a38f;font-weight:600;line-height:1.35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pp-err{color:#a2361f}}
:root[data-theme="dark"] .pp-err{color:#a2361f}
.pp-legal{margin:2px 0 0;font-size:13px;line-height:1.45;color:var(--ink-3)}
.pp-legal a{color:var(--accent)}
</style>
</head>
<body>
<div class="pp">
  <header class="pp-top" id="top"></header>
  <main class="pp-wrap" id="main"><p class="pp-muted">Betöltés…</p></main>
</div>
<div class="ui-savebar pp-bar" id="savebar" role="region" aria-label="Mentés">
  <span id="savestate" aria-live="polite"></span>
  <button class="ui-btn quiet" id="pv-go" type="button">Előnézet</button>
  <button class="ui-btn" id="save" type="button">Mentés</button>
  <p class="pp-err" id="saveerr" role="alert" hidden></p>
</div>
<div class="ui-toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="calendar.js"></script>
<script src="schedule-editor.js"></script>
<script src="plebania.js"></script>
</body>
</html>
