<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Harangszó plébániáknak</title>
<meta name="theme-color" content="#ffffff">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/bell.svg" type="image/svg+xml">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}</style>
<link rel="stylesheet" href="styles.css">
<style>
/* Parish portal: one church at a time, phone first, in the map's world: white page, ink, hairline sections, black
   primary buttons, the platform font. Shared parts (ui-*, the week board se-*, the photo cp-*) come from styles.css;
   only this page's layout lives here. Below 980px the four sections are a tab bar at the bottom (like the map's) and
   the preview is a switch; from 980px the tabs sit under the header and the preview is a column on the right. */
html,body{height:auto}
body{overflow:auto}
.pp{min-height:100%}

/* Header: the name on the sign-in screens, the church on the editor */
.pp-top{max-width:1160px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 20px}
.pp-brand{display:inline-flex;align-items:baseline;gap:8px;min-height:44px;padding-top:11px;font:700 var(--fs-3)/1.2 var(--f-body);color:var(--ink);text-decoration:none}
.pp-brand small{font:400 var(--fs-1)/1.2 var(--f-body);color:var(--ink-3)}
.pp-head{flex:1 1 320px;min-width:0;display:grid;gap:4px;padding-top:6px}
.pp-kicker{font:700 var(--fs-1)/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pp-name{margin:0;font:700 var(--fs-4)/1.2 var(--f-body);letter-spacing:-.01em;color:var(--ink);text-wrap:balance;overflow-wrap:anywhere;hyphens:auto}
.pp-state{margin:0;font-size:var(--fs-1);line-height:1.35;color:var(--ink-2)}
.pp-who{display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;margin-left:auto;font-size:var(--fs-1);color:var(--ink-3)}
.pp-who .em{margin-right:6px;overflow-wrap:anywhere}
.pp-who .ui-btn{padding:0 10px;font-size:var(--fs-1);font-weight:600}
@media (min-width:980px){.pp-top{padding-top:20px}.pp-top.church .pp-who{padding-top:6px}}
@media (max-width:979.98px){.pp-top.church .pp-who{flex-basis:100%;margin:-6px 0 0 -10px}.pp-top.church .pp-who .em{margin-left:10px}}

/* Page body, section tabs, the phone's edit / preview switch */
.pp-wrap{max-width:1160px;margin:0 auto;padding:6px 20px calc(var(--tabbar-h) + 96px)}
/* Phones: the sections are a tab bar at the bottom, as on the map: white, a hairline on top, the open one in ink. */
.ui-tabbar.pp-tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;height:var(--tabbar-h);padding:0 4px env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);border-bottom:0}
.pp-tabs .ui-tab{color:var(--ink-3);box-shadow:inset 0 2px 0 transparent}
.pp-tabs .ui-tab[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}
.pp-mode{margin:0 0 18px}
.pp-cols{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media (max-width:979.98px){
  .pp-cols[data-mode="edit"] .pp-pv{display:none}
  .pp-cols[data-mode="preview"] .pp-sec{display:none}
  .ui-savebar.pp-bar{bottom:calc(var(--tabbar-h) + 10px)}
  .ui-toast{bottom:calc(var(--tabbar-h) + 72px)}}
@media (min-width:980px){
  .pp-wrap{padding-bottom:110px}
  .ui-tabbar.pp-tabs{position:static;height:auto;max-width:560px;margin:4px 0 24px;padding:0;border-top:0;border-bottom:1px solid var(--line)}
  .pp-tabs .ui-tab{color:var(--ink-2);box-shadow:inset 0 -2px 0 transparent}
  .pp-tabs .ui-tab[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
  .pp-mode{display:none}
  .pp-cols{grid-template-columns:minmax(0,1fr) 340px;gap:40px;align-items:start}
  .pp-pv{position:sticky;top:20px}}

/* Section content: hairline sections, no boxes */
.pp-lead{margin:0 0 16px;max-width:62ch;color:var(--ink-2);font-size:var(--fs-2);line-height:1.45}
.pp-notice{margin:0 0 18px;max-width:78ch;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font-size:var(--fs-2);line-height:1.45}
.pp-list{display:grid;border-top:1px solid var(--line)}
.pp-card{display:grid;gap:12px;min-width:0;padding:16px 0 18px;border-bottom:1px solid var(--line)}
.pp-sec>.pp-list:first-child{border-top:0}
.pp-sec>.pp-list:first-child>.pp-card:first-child{padding-top:0}
.pp-card h3{margin:0;font:700 var(--fs-3)/1.25 var(--f-body);color:var(--ink)}
.pp-card .when{display:block;margin-top:2px;color:var(--ink-3);font-size:var(--fs-1)}
.pp-line{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.pp-line .ui-field{flex:1 1 140px}
.pp-line .ui-field.t{flex:0 1 128px}
.pp-line .ui-field.d{flex:0 0 168px}
.pp-line .ui-field.wide{flex:3 1 220px}
.pp-rows{display:grid}
.pp-rows>.pp-line{padding:12px 0;border-top:1px solid var(--line)}
.pp-rows>.pp-line:first-child{padding-top:0;border-top:0}
.pp-add{justify-self:start}
.pp-list>.pp-add{margin-top:16px}
.pp-check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:var(--fs-2);color:var(--ink);cursor:pointer}
.pp-hours{display:grid;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pp-hours .pp-line .ui-field{flex:0 1 128px}
.pp-card>.ui-seg button{padding:0 6px;line-height:1.15}
.pp-hours .ui-daypick{max-width:440px}
/* Ünnepek: a long list of the same three-way choice; the chosen one is outlined, not filled, so the page stays calm */
.pp-card>.ui-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--ink)}
.pp-muted{margin:0;color:var(--ink-3);font-size:var(--fs-1);line-height:1.45}
.pp-list>.pp-muted{padding:14px 0;border-bottom:1px solid var(--line)}

/* What the faithful will see */
.pp-pv{min-width:0}
.pp-pv h2{margin:0;font:700 var(--fs-4)/1.2 var(--f-body);letter-spacing:-.01em;color:var(--ink)}
.pv-kicker{margin:4px 0 10px;font:700 var(--fs-1)/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pv-note{margin:-4px 0 10px;color:var(--ink-3);font-size:var(--fs-1)}
.ui-row.pv-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:baseline}
.pv-row .d{color:var(--ink-3);font-size:var(--fs-1)}
.pv-row .d b{display:block;color:var(--ink);font-size:var(--fs-2);font-weight:600}
.pv-row .f{display:block;margin-top:2px;color:var(--ink-2);font-size:var(--fs-1)}
.pv-row .none{color:var(--ink-3)}
.pv-map{margin-top:16px}
@media (max-width:979.98px){.pp-pv h2{display:none}.pv-kicker{margin-top:0}}

/* Sign-in, choosing a church, asking for access: one plain column */
.pp-narrow{max-width:440px;margin:12px auto 0;display:grid;gap:16px}
.pp-title{margin:0;font:700 var(--fs-4)/1.2 var(--f-body);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.pp-narrow h2{margin:0;font:700 var(--fs-1)/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pp-narrow .pp-lead{margin:0}
.pp-msg{margin:0;font-size:var(--fs-2)}
.pp-msg:empty{display:none}
.pp-msg.ok{color:var(--ink)} .pp-msg.err{color:var(--closed)}
.pp-links{display:flex;flex-wrap:wrap;gap:2px;margin:-6px -10px 0}
.pp-links .ui-btn{padding:0 10px}
.pp-results{max-height:50vh;overflow:auto}
.pp-results:empty{display:none}
.pp-results .ui-row{display:grid;gap:1px;justify-items:start}
.pp-results .ui-row small{color:var(--ink-3);font-size:var(--fs-1)}
.pp-results .ui-row{position:relative;padding-right:40px}
.pp-results .ui-row[aria-pressed="true"]{background:var(--accent-soft);padding-left:12px}
.pp-results .ui-row[aria-pressed="true"]::after{content:"✓";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink)}
.pp-results .ui-row:first-child{border-top:0}
.pp-reqs{display:grid;gap:6px}
.pp-req{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px}
.pp-req .muted{font-size:var(--fs-1)}
.pp-form{display:grid;gap:16px;padding-top:4px}

/* Save bar: the error line above the count; the dark-mode red on the ink bar, the light-mode red on the light bar */
.ui-savebar.pp-bar{flex-wrap:wrap}
.pp-err{flex:1 0 100%;order:-1;margin:0 0 4px;color:#ff5a5f;font-weight:600;line-height:1.35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pp-err{color:#b4232a}}
:root[data-theme="dark"] .pp-err{color:#b4232a}
.pp-legal{margin:0;font-size:var(--fs-1);line-height:1.45;color:var(--ink-3)}
.pp-legal a{color:var(--ink-2)}
</style>
</head>
<body>
<div class="pp">
  <header class="pp-top" id="top"></header>
  <main class="pp-wrap" id="main"><p class="pp-muted">Betöltés…</p></main>
</div>
<div class="ui-savebar pp-bar" id="savebar" role="region" aria-label="Mentés">
  <span id="savestate" aria-live="polite"></span>
  <button class="ui-btn quiet" id="pv-go" type="button">Előnézet</button>
  <button class="ui-btn" id="save" type="button">Mentés</button>
  <p class="pp-err" id="saveerr" role="alert" hidden></p>
</div>
<div class="ui-toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="calendar.js"></script>
<script src="schedule-editor.js"></script>
<script src="church-photo.js"></script>
<script src="plebania.js"></script>
</body>
</html>
