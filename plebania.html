<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Harangszó plébániáknak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}</style>
<link rel="stylesheet" href="styles.css">
<style>
/* Parish portal: one church, its week as a notice board, plain questions instead of settings. */
body{overflow:auto;font-size:16px}
.pp{min-height:100%;display:grid;grid-template-rows:auto 1fr}
.pp-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.pp-top .brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;text-decoration:none;color:var(--ink)}
.pp-top .brand small{font-family:var(--f-body);font-weight:500;font-size:.82rem;color:var(--ink-3);margin-left:8px}
.pp-top .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.86rem;color:var(--ink-2);flex-wrap:wrap}
.wrap{max-width:1160px;margin:0 auto;width:100%;padding:22px max(16px,env(safe-area-inset-left,0px)) 120px}
.btn{min-height:44px;padding:9px 16px;font-size:.95rem}
.btn.primary{color:var(--on-accent)}
.btn.quiet{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--closed)}
.field{display:grid;gap:6px;font-size:.92rem;color:var(--ink-2);min-width:0}
.field > span{font-weight:500;color:var(--ink)}
.field small{color:var(--ink-3);font-size:.82rem}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%;min-width:0;min-height:44px;color:var(--ink)}
.field textarea{min-height:84px;resize:vertical}
input[type=time]{font-family:var(--f-mono);font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.narrow{max-width:460px;margin:24px auto;display:grid;gap:14px}
h1.title{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.15;margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:0}
.lead{color:var(--ink-2);margin:0;max-width:62ch}
.msg{font-size:.92rem;margin:0}.msg.ok{color:var(--open)}.msg.err{color:var(--closed)}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}

/* Church header + section tabs */
.head{display:grid;gap:6px;margin-bottom:18px}
.head .place{color:var(--ink-2)}
.notice{border-left:4px solid var(--gold);background:var(--gold-soft);color:var(--ink);padding:12px 14px;border-radius:0 10px 10px 0;margin:0 0 18px;max-width:78ch}
.sections{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:20px}
.sections button{white-space:nowrap;flex:none;border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
.sections button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cols{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.cols{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.cols aside{position:sticky;top:16px}}

/* The week board: one line per day, the day in the display face, the times as large mono plates. */
.board{display:grid;border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.day h3{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:6px 0 0}
.day.sun h3{font-weight:700;color:var(--gold)}
.day .slots{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
@media (max-width:560px){.day{grid-template-columns:1fr;gap:6px}.day h3{margin:0}}
.tslot{display:grid;gap:2px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--accent);background:var(--surface);border-radius:8px;padding:7px 12px 8px;cursor:pointer;min-width:5.6rem;color:var(--ink)}
.tslot:hover{border-color:var(--ink-3);border-left-color:inherit}
.tslot b{font-family:var(--f-mono);font-weight:600;font-size:1.2rem;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tslot span{font-size:.8rem;color:var(--ink-2);line-height:1.3;max-width:15rem}
.tslot.k-confession{border-left-color:var(--penance)}
.tslot.k-adoration,.tslot.k-prayer{border-left-color:var(--gold)}
.tslot.k-rorate{border-left-color:var(--accent);border-left-style:double;border-left-width:6px}
.tslot.k-mass:hover{border-left-color:var(--accent)} .tslot.k-confession:hover{border-left-color:var(--penance)} .tslot.k-adoration:hover,.tslot.k-prayer:hover{border-left-color:var(--gold)}
.add{border:1px dashed var(--border);background:none;border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--accent);font-weight:500;min-height:52px}
.add:hover{background:var(--accent-soft);border-style:solid}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2);margin:12px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Preview */
.preview{display:grid;gap:12px}
.preview h2{font-size:1.15rem}
.pday{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid var(--line)}
.pday .d{color:var(--ink-2)} .pday .d b{display:block;color:var(--ink);font-weight:600}
.pday .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pday .t em{font-style:normal;font-family:var(--f-body);color:var(--ink-3);font-size:.82rem}
.pday .f{color:var(--gold);font-size:.8rem}

/* Lists (feasts, events, hours) */
.rows{display:grid;gap:10px}
.rowcard{display:grid;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px}
.rowcard .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rowcard .top h3{font-family:var(--f-display);font-size:1.1rem;margin:0;font-weight:600}
.rowcard .top .when{color:var(--ink-3);font-size:.88rem}
.line{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.line .field{flex:1 1 140px}
.line .field.t{flex:0 1 130px}
.line .field.wide{flex:3 1 220px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;padding:0 12px;cursor:pointer;color:var(--closed)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{border:1px solid var(--border);background:var(--surface);border-radius:8px;min-width:3rem;min-height:44px;padding:0 10px;cursor:pointer;color:var(--ink-2);font-weight:500}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.opt small{display:block;color:var(--ink-3)}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;color:var(--ink-2);font-size:.88rem}
.toggles button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}

/* Dialog: a bottom sheet on phones, a centred panel on wider screens. */
dialog.ed{border:0;padding:0;border-radius:16px;width:min(620px,100vw - 24px);max-height:min(92vh,900px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-float)}
dialog.ed::backdrop{background:rgb(10 14 22 / .45)}
@media (max-width:640px){dialog.ed{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:94vh}}
.ed form{display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:inherit}
.ed header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ed header h2{font-size:1.25rem}
.ed header .close{margin-left:auto}
.ed .body{overflow-y:auto;padding:18px 20px;display:grid;gap:20px}
.ed footer{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ed footer .grow{flex:1}
.q{display:grid;gap:8px}
.q > .ql{font-weight:600;font-size:.98rem}
.q > .qh{color:var(--ink-3);font-size:.86rem;margin-top:-4px}
details.more{border-top:1px solid var(--line);padding-top:14px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);min-height:32px}
details.more[open] summary{margin-bottom:14px}
details.more .inner{display:grid;gap:18px}

/* Save bar */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgb(0 0 0 / .08);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.savebar .in{max-width:1160px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.savebar .state{font-size:.92rem;color:var(--ink-2)}
.savebar .state.dirty{color:var(--gold);font-weight:600}
.savebar .btn.primary{margin-left:auto;min-width:10rem}
.btn:disabled{opacity:.5;cursor:default}
.results{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:50vh;overflow:auto}
.results button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid}
.results button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.results small{color:var(--ink-3)}
.status{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;background:var(--sunken);color:var(--ink-2)}
.status.pending{background:var(--gold-soft);color:var(--gold)} .status.approved{background:var(--open-soft);color:var(--open)} .status.rejected{background:var(--sunken);color:var(--closed)}
footer.foot{max-width:1160px;margin:0 auto;padding:0 16px 24px;color:var(--ink-3);font-size:.86rem}
</style>
</head>
<body>
<div class="pp">
  <header class="pp-top">
    <a class="brand" href="./">Harangszó<small>plébániáknak</small></a>
    <div class="who" id="who"></div>
  </header>
  <main class="wrap" id="main"><p class="muted">Betöltés…</p></main>
</div>
<div class="savebar" id="savebar" hidden><div class="in"><span class="state" id="savestate"></span><button class="btn primary" id="save" type="button">Mentés</button></div></div>
<dialog class="ed" id="ed" aria-labelledby="ed-title"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="calendar.js"></script>
<script src="plebania.js"></script>
</body>
</html>
