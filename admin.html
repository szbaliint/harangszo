<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Harangszó szerkesztő</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}</style>
<link rel="stylesheet" href="styles.css">
<style>
/* Admin: rail · church list · the open church. Shared parts (ui-*, the week board se-*) come from styles.css; only
   this page's layout lives here. ≥1100px three columns, each scrolling on its own; 720–1100px the rail is a tab bar
   on top and the list and the church sit side by side; below 720px one column: tab bar, then the list or the church. */
body{overflow:auto;font-size:15px}
.ad{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);align-content:start}
.ad-main{min-width:0;padding-bottom:110px}
.ad:is([data-page="sugg"],[data-page="access"]) .ad-list{display:none}

/* Rail: a top bar with a tab bar below 1100px, a column from 1100px */
.ad-rail{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--sunken);border-bottom:1px solid var(--line);min-width:0}
.ad-logo{margin:0;font:700 22px/1.05 var(--f-display);color:var(--ink)}
.ad-logo small{display:block;margin-top:2px;font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ad-nav.ui-tabbar{flex:1 1 auto;max-width:620px;background:var(--surface);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.ad-nav .ui-tab{flex:1 1 auto;padding:0 10px;white-space:nowrap}
.ad-n{color:var(--ink-3);font-weight:400;font-size:13px;font-variant-numeric:tabular-nums}
.ad-badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--penance);color:var(--on-penance);font:700 11.5px/20px var(--f-body);text-align:center;font-variant-numeric:tabular-nums}
.ad-badge:empty{display:none}
.ad-me{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;margin-left:auto;font-size:13px;color:var(--ink-3);min-width:0}
.ad-me .em{overflow-wrap:anywhere}
.ad-me .ui-btn{padding:0 10px;font-size:13.5px;font-weight:600}
@media (max-width:719.98px){
  .ad-nav.ui-tabbar{order:3;flex-basis:100%;max-width:none;overflow-x:auto;scrollbar-width:none}
  .ad-nav.ui-tabbar::-webkit-scrollbar{display:none}
  .ad-nav .ui-tab{flex:1 0 auto}
  .ad-nav .ad-n{display:none}
  .ad-rail .ad-me{flex:1 1 0;flex-wrap:nowrap;justify-content:flex-end}
  .ad-rail .ad-me .em{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ad-rail .ad-me .ui-btn{flex:none}}

/* Church list */
.ad-list{display:flex;flex-direction:column;gap:10px;padding:16px 12px;min-width:0}
.ad-search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink-3);
  transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.ad-search svg{flex:none}
.ad-search input{flex:1 1 auto;min-width:0;height:42px;margin:0;padding:0;border:0;background:none;outline:none;color:var(--ink);font:400 15px/1.2 var(--f-body)}
.ad-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 0 5px var(--accent-soft)}
.ad-chips{display:flex;flex-wrap:wrap;gap:10px 6px;padding:2px 0}
.ad-chips .ui-chip{font-size:13px;padding:0 11px}
.ad-fbadge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 11px/18px var(--f-body);text-align:center}
.ad-cnt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ad-cnt .ui-btn{margin-right:-8px;padding:0 10px;font-size:13.5px}
.ad-clist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ad-clist[aria-busy="true"]{opacity:.55}
.ad-it{width:100%;display:grid;gap:3px;min-height:44px;padding:9px 10px;border:0;border-radius:12px;background:none;color:var(--ink);text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background-color .18s var(--ease),box-shadow .18s var(--ease)}
@media (hover:hover){.ad-it:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}}
.ad-it[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1.5px var(--accent)}
.ad-it .nm{font:600 16.5px/1.2 var(--f-display);overflow-wrap:anywhere;hyphens:auto;text-wrap:balance}
.ad-it .sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px;line-height:1.3;color:var(--ink-3)}
.ad-it .ui-tag{padding:1px 8px;font-size:11.5px}
.ad-list>.ui-btn{flex:none}
.ad-empty{margin:0;padding:12px 10px;color:var(--ink-3);font-size:14px}
.ad-fsheet .ad-fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* The open church: header, underline tabs, tab body */
.ad-ch{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 16px;padding:18px 24px 0}
.ad-back{display:none;margin:-6px 0 -4px -12px;padding:0 12px}
.ad-cht{flex:1 1 300px;min-width:0}
.ad-name{margin:0;font:600 28px/1.12 var(--f-display);color:var(--ink);overflow-wrap:anywhere;hyphens:auto;text-wrap:balance}
.ad-meta{margin:5px 0 0;font-size:13.5px;line-height:1.4;color:var(--ink-3);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ad-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ad-pub{display:flex;align-items:center;gap:8px;min-height:44px;padding-right:6px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.ad-tabs{display:flex;gap:2px;margin-top:12px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ad-tabs::-webkit-scrollbar{display:none}
.ad-tab{flex:none;min-height:44px;padding:0 14px;border:0;border-radius:0;background:none;color:var(--ink-2);font:400 14.5px/1.2 var(--f-body);cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:color .18s var(--ease),box-shadow .18s var(--ease)}
.ad-tab[aria-pressed="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2.5px 0 var(--accent)}
@media (hover:hover){.ad-tab:hover{color:var(--ink)}}
.ad-body{padding:16px 24px}
.ad-loading{margin:0;padding:24px;color:var(--ink-3)}

/* Miserend: the week board, admin boxes beside it from 1100px */
.ad-sched{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.ad-side{display:grid;gap:12px;align-content:start;min-width:0}
.ad-box.ui-card{display:grid;gap:8px;padding:12px 14px;border-radius:16px}
.ad-box h2{margin:0;font:700 11.5px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ad-kv{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px;padding:4px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.35;color:var(--ink)}
.ad-box h2+.ad-kv{border-top:0}
.ad-kv>span:first-child{color:var(--ink-3)}
.ad-kv>:last-child{text-align:right;overflow-wrap:anywhere;min-width:0}
.ad-kv a{color:var(--accent)}
.ad-kv .ui-field{flex:1 1 auto;max-width:190px}
.ad-kv select{min-height:38px;padding:6px 10px;font-size:14px}
.ad-tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;border-top:1px solid var(--line);font-size:14px;color:var(--ink);cursor:pointer}
.ad-tg small{display:block;margin-top:1px;font-size:12.5px;line-height:1.3;color:var(--ink-3)}
.ad-sg{display:grid;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.ad-box h2+.ad-sg{padding-top:0;border-top:0}
.ad-sg p{margin:0;font-size:13.5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.ad-sg .m{color:var(--ink-3);font-size:12.5px}
.ad-two{display:flex;gap:6px;margin-top:4px}
.ad-two .ui-btn{flex:1 1 0;min-width:0;padding:0 10px;font-size:14px}
.ad-link{justify-self:start;margin-left:-10px;padding:0 10px;font-size:14px}
@media (min-width:1360px){.ad-sched{grid-template-columns:minmax(0,1fr) 290px;align-items:start}}
/* Narrower than the portal's laptop board, as in the admin mockup: day name in a left column, tiles on one line. */
@container (min-width:460px){
  .ad .se-day.ui-card{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;column-gap:8px;padding:8px 12px}
  .ad .se-dh{flex-direction:column;align-items:flex-start;gap:2px;margin:0;font-size:16.5px}
  .ad .se-tiles{row-gap:8px}
  .ad .se-tile{flex-direction:row;align-items:baseline;gap:5px;min-height:36px;padding:7px 10px}
  .ad .se-tile.k-rorate{padding:5px 8px}
  .ad .se-tile::before{content:"";position:absolute;inset:-4px 0}
  .ad .se-tile b{font-size:15px}
  .ad .se-tile span{font-size:12.5px}
  .ad .se-tile.se-add{align-items:center;min-width:40px}}

/* Forms in cards (Ünnepek, Események, Adatok, Szerkesztők) */
.ad-stack{display:grid;gap:12px;max-width:860px}
.ad-lead{margin:0 0 12px;max-width:68ch;color:var(--ink-2);font-size:14.5px;line-height:1.45}
.ad-stack>.ad-lead{margin:0}
.ad-lead a{color:var(--accent)}
.ad-card.ui-card{display:grid;gap:12px}
.ad-card h3{margin:0;font:600 19px/1.2 var(--f-display);color:var(--ink)}
.ad-cardh{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px}
.ad-when{display:block;margin-top:2px;color:var(--ink-3);font-size:13.5px;font-variant-numeric:tabular-nums}
.ad-line{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.ad-line .ui-field{flex:1 1 150px}
.ad-line .ui-field.ad-t{flex:0 1 112px}
.ad-line .ui-field.wide{flex:3 1 240px}
.ad-rows{display:grid}
.ad-rows>.ad-line,.ad-rows>.ad-hours{padding:12px 0;border-top:1px solid var(--line)}
.ad-rows>:first-child{padding-top:0;border-top:0}
.ad-rows:empty{display:none}
.ad-hours{display:grid;gap:10px}
.ad-hours .ui-daypick{max-width:440px}
.ad-grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ad-check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:14.5px;color:var(--ink);cursor:pointer}
.ad-add{justify-self:start}
.ad-card>.ui-seg{max-width:420px}
.ad-hint{margin:0;color:var(--gold);font-size:13.5px;align-self:center}
.ad-muted{margin:0;color:var(--ink-3);font-size:14px;line-height:1.4}
.ad-h2{margin:8px 0 0;font:600 21px/1.2 var(--f-display);color:var(--ink)}
.ad-danger{display:flex;flex-wrap:wrap;gap:8px}
.ad-row2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.ad-row2 .who{min-width:0;overflow-wrap:anywhere}
.ad-row2 .who small{display:block;color:var(--ink-3);font-size:13px}
.ad-hist .ui-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:2px 12px}
.ad-hist .w{color:var(--ink-3);font-size:13.5px}
.ad-hist .s{grid-column:2;color:var(--ink-3);font-size:13px}
@media (max-width:539.98px){.ad-hist .ui-row{grid-template-columns:minmax(0,1fr)}.ad-hist .s{grid-column:1}}

/* Pages: Javaslatok, Hozzáférések, Összevonás */
.ad-page{display:grid;gap:12px;max-width:860px;padding:20px 24px}
.ad-ptitle{margin:0;font:600 28px/1.15 var(--f-display);color:var(--ink);text-wrap:balance}
.ad-page>.ad-lead{margin:0}
.ad-seg.ui-seg{max-width:460px}
.ad-cards{display:grid;gap:10px}
.ad-sgcard.ui-card{display:grid;gap:6px}
.ad-cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ad-ctitle{margin:0;font:600 18px/1.25 var(--f-display);color:var(--ink);overflow-wrap:anywhere}
.ad-sgcard p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.ad-cacts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.ad-msg{margin:0;font-size:14px}
.ad-msg:empty{display:none}
.ad-msg.ok{color:var(--open)} .ad-msg.err{color:var(--closed)}
.ad-merge.ui-card{display:grid;gap:12px}
.ad-merge .ad-clist{max-height:42vh;overflow-y:auto;margin:0 -6px;padding:2px 6px}
.ad-cmp{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.ad-cmp>p{margin:0}
.ad-fs{display:grid;gap:0;margin:0;padding:6px 12px;border:1px solid var(--line);border-radius:14px}
.ad-fs legend{padding:0 4px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.ad-radio{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14.5px;cursor:pointer}
.ad-radio input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--accent)}

/* Sign-in and the "not for you" screens */
.ad-narrow.ui-card{max-width:440px;margin:48px auto;padding:22px 20px;display:grid;gap:14px}
.ad-narrow.wide{max-width:640px}
.ad-narrow p{margin:0;line-height:1.45}
.ad-narrow .ui-btn{justify-self:start}
.ad[data-page="login"] .ad-main{padding:0 16px 48px}
code.snip{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunken);padding:10px;border-radius:12px;font-family:var(--f-body);font-size:13px}

/* Save bar and toast: over the church column */
.ad-bar.ui-savebar{flex-wrap:wrap}
.ad-err{flex:1 0 100%;order:-1;margin:0 0 4px;color:#f4a38f;font-weight:600;line-height:1.35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ad-err{color:#a2361f}}
:root[data-theme="dark"] .ad-err{color:#a2361f}

/* Phones: one column; a church (or the merge panel) replaces the list, "‹ Lista" goes back */
@media (max-width:719.98px){
  .ad:is([data-page="churches"],[data-page="merge"])[data-view="church"] .ad-list{display:none}
  .ad:is([data-page="churches"],[data-page="merge"])[data-view="list"] .ad-main{display:none}
  .ad-back{display:inline-flex}
  .ad-ch{padding:14px 16px 0}
  .ad-cht{flex-basis:100%}
  .ad-name{font-size:25px}
  .ad-tabs{padding:0 8px}
  .ad-tab{padding:0 10px}
  .ad-body{padding:14px 16px}
  .ad-page{padding:16px}
  .ad-hist .ui-row{grid-template-columns:minmax(0,1fr)}}
/* Tablets and laptops: the rail on top, list and church side by side, each scrolling on its own */
@media (min-width:720px){
  .ad:not([data-page="login"]){height:100dvh;min-height:0;overflow:hidden;grid-template-columns:330px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .ad-rail{grid-column:1/-1}
  .ad-list{grid-column:1;grid-row:2;overflow-y:auto;border-right:1px solid var(--line)}
  .ad:not([data-page="login"]) .ad-main{grid-column:2;grid-row:2;overflow-y:auto}
  .ad:is([data-page="sugg"],[data-page="access"]) .ad-main{grid-column:1/-1}
  .ad-bar.ui-savebar,.ad-toast.ui-toast{left:342px}}
@media (min-width:1100px){
  .ad:not([data-page="login"]){grid-template-columns:200px 330px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .ad-rail{grid-column:1;grid-row:1;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:4px;padding:18px 12px;border-bottom:0;overflow-y:auto}
  .ad-logo{padding:0 10px 14px}
  .ad-nav.ui-tabbar{flex:none;flex-direction:column;gap:4px;max-width:none;padding:0;border:0;border-radius:0;background:none}
  .ad-nav .ui-tab{flex:none;justify-content:space-between;padding:0 10px;border-radius:10px;font-size:14.5px;text-align:left}
  .ad-nav .ui-tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgb(40 30 10 / .12)}
  .ad-me{flex-direction:column;align-items:flex-start;margin:auto 0 0;padding:0 10px;font-size:12.5px}
  .ad-me .ui-btn{margin-left:-10px;min-height:36px;font-size:12.5px}
  .ad-list{grid-column:2;grid-row:1}
  .ad:not([data-page="login"]) .ad-main{grid-column:3;grid-row:1}
  .ad:is([data-page="sugg"],[data-page="access"]) .ad-main{grid-column:2/-1}
  .ad-bar.ui-savebar,.ad-toast.ui-toast{left:542px}}
@media (prefers-reduced-motion:reduce){.ad-it,.ad-tab,.ad-search{transition:none!important}}
</style>
</head>
<body>
<div class="ad" id="app" data-page="login" data-view="list">
  <nav class="ad-rail" id="rail" aria-label="Adminisztráció" hidden>
    <p class="ad-logo">Harangszó<small>Adminisztráció</small></p>
    <div class="ad-nav ui-tabbar" role="group" aria-label="Részek">
      <button type="button" class="ui-tab" data-page="churches" aria-pressed="true"><span>Templomok</span><span class="ad-n" id="n-churches"></span></button>
      <button type="button" class="ui-tab" data-page="sugg" aria-pressed="false"><span>Javaslatok</span><span class="ad-badge" id="sugg-count"></span></button>
      <button type="button" class="ui-tab" data-page="access" aria-pressed="false"><span>Hozzáférések</span><span class="ad-badge" id="access-count"></span></button>
      <button type="button" class="ui-tab" data-page="merge" aria-pressed="false"><span>Összevonás</span></button>
    </div>
    <div class="ad-me" id="who"></div>
  </nav>
  <section class="ad-list" id="listcol" aria-label="Templomok" hidden></section>
  <main class="ad-main" id="main"><p class="ad-loading">Betöltés…</p></main>
</div>
<div class="ui-savebar ad-bar" id="savebar" role="region" aria-label="Mentés">
  <span id="savestate" aria-live="polite"></span>
  <button class="ui-btn" id="bar-save" type="button">Mentés</button>
  <p class="ad-err" id="saveerr" role="alert" hidden></p>
</div>
<div class="ui-toast ad-toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="calendar.js"></script>
<script src="schedule-editor.js"></script>
<script src="admin.js"></script>
</body>
</html>
