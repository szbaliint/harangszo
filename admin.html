<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Harangszó szerkesztő</title>
<meta name="theme-color" content="#ffffff">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/bell.svg" type="image/svg+xml">
<style>*,*::before,*::after{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}</style>
<link rel="stylesheet" href="styles.css">
<style>
/* Admin: rail · church list · the open church, in the map's world: white, ink, hairline rows and sections, black
   primary buttons, the platform font; nothing boxed but the fields. Shared parts (ui-*, the week board se-*, the
   photo cp-*) come from styles.css; only this page's layout lives here. ≥1100px three columns, each scrolling on its
   own; 720–1100px the rail is a tab bar on top and the list and the church sit side by side; below 720px one column:
   tab bar, then the list or the church. */
html,body{height:auto}
body{overflow:auto}
.ad{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);align-content:start}
.ad-main{min-width:0;padding-bottom:110px}
.ad:is([data-page="sugg"],[data-page="access"],[data-page="stats"]) .ad-list{display:none}

/* Rail: a top bar with a tab bar below 1100px, a column from 1100px */
.ad-rail{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;padding:8px 16px 0;background:var(--bg);border-bottom:1px solid var(--line);min-width:0}
.ad-logo{margin:0;font:700 var(--fs-3)/1.2 var(--f-body);color:var(--ink)}
.ad-logo small{display:block;margin-top:1px;font:400 var(--fs-1)/1.3 var(--f-body);color:var(--ink-3)}
.ad-nav.ui-tabbar{flex:1 1 auto;max-width:640px;border-bottom:0;background:transparent}
.ad-nav .ui-tab{flex:1 1 auto;padding:0 10px;white-space:nowrap}
.ad-n{color:var(--ink-3);font-weight:400;font-size:var(--fs-1)}
/* Counts that wait for a decision: a plain ink circle with white numerals, like the map's clusters */
.ad-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--bg);font:600 var(--fs-1)/20px var(--f-body);text-align:center}
.ad-badge:empty{display:none}
.ad-me{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;margin-left:auto;font-size:var(--fs-1);color:var(--ink-3);min-width:0}
.ad-me .em{overflow-wrap:anywhere}
.ad-me .ui-btn{padding:0 10px;font-size:var(--fs-1)}
@media (max-width:719.98px){
  .ad-nav.ui-tabbar{order:3;flex-basis:100%;max-width:none;margin:0 -16px;padding:0 6px;overflow-x:auto;scrollbar-width:none}
  .ad-nav.ui-tabbar::-webkit-scrollbar{display:none}
  .ad-nav .ui-tab{flex:1 0 auto}
  .ad-nav .ad-n{display:none}
  .ad-rail .ad-me{flex:1 1 0;flex-wrap:nowrap;justify-content:flex-end}
  .ad-rail .ad-me .em{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ad-rail .ad-me .ui-btn{flex:none}}

/* Church list: a search field, filter chips, hairline rows */
.ad-list{display:flex;flex-direction:column;gap:10px;padding:16px;min-width:0}
.ad-search{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--ink-2);
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.ad-search svg{flex:none}
.ad-search input{flex:1 1 auto;min-width:0;height:42px;margin:0;padding:0;border:0;background:none;outline:none;color:var(--ink);font:400 var(--fs-2)/1.2 var(--f-body)}
.ad-search input::placeholder{color:var(--ink-3);opacity:1}
.ad-search:focus-within{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ad-chips{display:flex;flex-wrap:wrap;gap:10px 6px;padding:2px 0}
.ad-chips .ui-chip{font-size:var(--fs-1);padding:0 11px}
.ad-fbadge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--bg);font:600 12px/18px var(--f-body);text-align:center}
.ad-cnt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--fs-1);color:var(--ink-3)}
.ad-cnt .ui-btn{margin-right:-10px;padding:0 10px;font-size:var(--fs-1)}
.ad-clist{list-style:none;margin:0 -16px;padding:0;border-top:1px solid var(--line)}
.ad-clist[aria-busy="true"]{opacity:.55}
.ad-it{width:100%;display:grid;gap:4px;min-height:44px;padding:10px 16px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background-color .15s var(--ease)}
@media (hover:hover){.ad-it:hover{background:var(--sunken)}}
.ad-it:active{background:var(--sunken)}
.ad-it[aria-current="true"]{background:var(--accent-soft)}
.ad-it[aria-current="true"] .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.ad-it .nm{font:600 var(--fs-2)/1.3 var(--f-body);overflow-wrap:anywhere;hyphens:auto;text-wrap:balance}
.ad-it .sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:var(--fs-1);line-height:1.3;color:var(--ink-3)}
.ad-it .ui-tag{padding:0 6px}
.ad-list>.ui-btn{flex:none}
.ad-empty{margin:0;padding:14px 16px;color:var(--ink-3);font-size:var(--fs-2)}
.ad-fsheet .ad-fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* The open church: header, underline tabs, tab body */
.ad-ch{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 16px;padding:20px 24px 0}
.ad-back{display:none;margin:-6px 0 -4px -10px;padding:0 10px}
.ad-cht{flex:1 1 300px;min-width:0}
.ad-name{margin:0;font:700 var(--fs-4)/1.2 var(--f-body);letter-spacing:-.01em;color:var(--ink);overflow-wrap:anywhere;hyphens:auto;text-wrap:balance}
.ad-meta{margin:4px 0 0;font-size:var(--fs-1);line-height:1.4;color:var(--ink-3);overflow-wrap:anywhere;text-wrap:pretty}
.ad-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ad-pub{display:flex;align-items:center;gap:8px;min-height:44px;padding-right:6px;font-size:var(--fs-1);color:var(--ink-2);cursor:pointer}
.ad-tabs{display:flex;gap:0;margin-top:14px;padding:0 24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.ad-tabs::-webkit-scrollbar{display:none}
.ad-tab{flex:none;min-height:44px;padding:0 12px;border:0;border-radius:0;background:none;color:var(--ink-2);font:400 var(--fs-2)/1.2 var(--f-body);cursor:pointer;
  -webkit-tap-highlight-color:transparent;box-shadow:inset 0 -2px 0 transparent;transition:color .15s var(--ease),box-shadow .15s var(--ease)}
.ad-tab:first-child{margin-left:-12px}
.ad-tab[aria-pressed="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
@media (hover:hover){.ad-tab:hover{color:var(--ink)}}
.ad-body{padding:20px 24px}
.ad-loading{margin:0;padding:24px;color:var(--ink-3)}

/* Miserend: the week board, admin sections beside it from 1360px (below it on narrower screens) */
.ad-sched{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.ad-side{display:grid;align-content:start;min-width:0;border-top:1px solid var(--line)}
.ad-box{display:grid;gap:8px;padding:14px 0 16px;border-bottom:1px solid var(--line);min-width:0}
.ad-box h2{margin:0 0 2px;font:700 var(--fs-1)/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ad-kv{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px;padding:4px 0;border-top:1px solid var(--line);font-size:var(--fs-1);line-height:1.35;color:var(--ink)}
.ad-box h2+.ad-kv{border-top:0}
.ad-kv>span:first-child{color:var(--ink-3)}
.ad-kv>:last-child{text-align:right;overflow-wrap:anywhere;min-width:0}
.ad-kv a{color:var(--ink)}
.ad-kv .ui-field{flex:1 1 auto;max-width:190px}
.ad-kv select{min-height:38px;padding:6px 10px;font-size:var(--fs-1)}
.ad-tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px 0;border-top:1px solid var(--line);font-size:var(--fs-2);color:var(--ink);cursor:pointer}
.ad-tg small{display:block;margin-top:2px;font-size:var(--fs-1);line-height:1.3;color:var(--ink-3)}
.ad-sg{display:grid;gap:4px;padding-top:10px;border-top:1px solid var(--line)}
.ad-box h2+.ad-sg{padding-top:0;border-top:0}
.ad-sg p{margin:0;font-size:var(--fs-2);line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.ad-sg .m{color:var(--ink-3);font-size:var(--fs-1)}
.ad-two{display:flex;gap:6px;margin-top:4px}
.ad-two .ui-btn{flex:1 1 0;min-width:0;padding:0 10px}
.ad-link{justify-self:start;margin-left:-10px;padding:0 10px}
@media (min-width:1360px){
  .ad-sched{grid-template-columns:minmax(0,1fr) 290px;gap:32px;align-items:start}
  .ad-side{border-top:0;border-left:1px solid var(--line);padding-left:20px}
  .ad-box:first-child{padding-top:0}
  .ad-box:last-child{border-bottom:0}}
/* Narrower than the portal's laptop board: day name in a left column, tiles on one line, from 460px. */
@container (min-width:460px){
  .ad .se-day{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;column-gap:8px;padding:8px 0}
  .ad .se-dh{flex-direction:column;align-items:flex-start;gap:2px;margin:0;font-size:var(--fs-2)}
  .ad .se-tiles{row-gap:8px}
  .ad .se-tile{flex-direction:row;align-items:baseline;gap:6px;min-height:36px;padding:7px 10px}
  .ad .se-tile::before{content:"";position:absolute;inset:-5px 0}
  .ad .se-tile b{font-size:var(--fs-2)}
  .ad .se-tile.se-add{align-items:center;min-width:40px}}

/* Forms (Ünnepek, Események, Adatok, Szerkesztők): hairline sections */
.ad-stack{display:grid;gap:16px;max-width:860px}
.ad-lead{margin:0 0 14px;max-width:68ch;color:var(--ink-2);font-size:var(--fs-2);line-height:1.45}
.ad-stack>.ad-lead{margin:0}
.ad-lead a{color:var(--ink)}
.ad-card{display:grid;gap:12px;min-width:0;padding-top:16px;border-top:1px solid var(--line)}
.ad-stack>.ad-card:first-child{padding-top:0;border-top:0}
.ad-card h3{margin:0;font:700 var(--fs-3)/1.25 var(--f-body);color:var(--ink)}
.ad-cardh{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px}
.ad-when{display:block;margin-top:2px;color:var(--ink-3);font-size:var(--fs-1)}
.ad-line{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.ad-line .ui-field{flex:1 1 150px}
.ad-line .ui-field.ad-t{flex:0 1 112px}
.ad-line .ui-field.ad-d{flex:0 0 168px}
.ad-line .ui-field.wide{flex:3 1 240px}
.ad-rows{display:grid}
.ad-rows>.ad-line,.ad-rows>.ad-hours{padding:12px 0;border-top:1px solid var(--line)}
.ad-rows>:first-child{padding-top:0;border-top:0}
.ad-rows:empty{display:none}
.ad-hours{display:grid;gap:10px}
.ad-hours .ui-daypick{max-width:440px}
.ad-grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ad-check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:var(--fs-2);color:var(--ink);cursor:pointer}
.ad-add{justify-self:start}
.ad-card>.ui-seg{max-width:420px}
.ad-hint{margin:0;color:var(--ink-2);font-size:var(--fs-1);align-self:center}
.ad-muted{margin:0;color:var(--ink-3);font-size:var(--fs-2);line-height:1.45}
.ad-h2{margin:12px 0 0;font:700 var(--fs-3)/1.25 var(--f-body);color:var(--ink)}
.ad-danger{display:flex;flex-wrap:wrap;gap:8px}
.ad-row2{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.ad-row2 .who{min-width:0;overflow-wrap:anywhere}
.ad-row2 .who small{display:block;color:var(--ink-3);font-size:var(--fs-1)}
.ad-hist .ui-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:2px 12px}
.ad-hist .w{color:var(--ink-3);font-size:var(--fs-1)}
.ad-hist .s{grid-column:2;color:var(--ink-3);font-size:var(--fs-1)}
@media (max-width:539.98px){.ad-hist .ui-row{grid-template-columns:minmax(0,1fr)}.ad-hist .s{grid-column:1}}

/* Pages: Javaslatok, Hozzáférések, Összevonás, Statisztika — items are hairline rows */
.ad-page{display:grid;gap:14px;max-width:860px;padding:24px}
.ad-ptitle{margin:0;font:700 var(--fs-4)/1.2 var(--f-body);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.ad-page>.ad-lead{margin:0}
.ad-seg.ui-seg{max-width:460px}
.ad-cards{display:grid;border-top:1px solid var(--line)}
.ad-cards>.ad-muted,.ad-cards>.ui-empty{padding:14px 0;border-bottom:1px solid var(--line)}
.ad-sgcard{display:grid;gap:6px;padding:14px 0 16px;border-bottom:1px solid var(--line);min-width:0}
.ad-sgcard .ad-muted{font-size:var(--fs-1)}
.ad-cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:var(--fs-1);color:var(--ink-3)}
.ad-ctitle{margin:0;font:700 var(--fs-3)/1.3 var(--f-body);color:var(--ink);overflow-wrap:anywhere}
.ad-sgcard p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.ad-cacts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.ad-msg{margin:0;font-size:var(--fs-2)}
.ad-msg:empty{display:none}
.ad-msg.ok{color:var(--ink)} .ad-msg.err{color:var(--closed)}
.ad-merge{display:grid;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.ad-merge .ad-clist{max-height:42vh;overflow-y:auto;margin:0}
.ad-merge .ad-it{padding-left:0;padding-right:0}
.ad-cmp{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.ad-cmp>p{margin:0}
.ad-fs{display:grid;gap:0;margin:0;padding:6px 14px;border:1px solid var(--line);border-radius:var(--r)}
.ad-fs legend{padding:0 4px;font-size:var(--fs-1);font-weight:700;color:var(--ink-2)}
.ad-radio{display:flex;align-items:center;gap:10px;min-height:44px;font-size:var(--fs-2);cursor:pointer}
.ad-radio input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--ink)}

/* Sign-in and the "not for you" screens: one plain column */
.ad-narrow{max-width:420px;margin:56px auto;display:grid;gap:16px}
.ad-narrow.wide{max-width:640px}
.ad-narrow p{margin:0;line-height:1.45}
.ad-narrow .ui-btn{justify-self:start}
.ad-narrow .ui-btn.primary[type="submit"]{justify-self:stretch}
.ad[data-page="login"] .ad-main{padding:0 20px 48px}
code.snip{display:block;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunken);padding:10px 12px;border-radius:var(--r);font-family:var(--f-body);font-size:var(--fs-1)}

/* Save bar and toast: over the church column; the error line in the red that reads on the bar */
.ad-bar.ui-savebar{flex-wrap:wrap}
.ad-err{flex:1 0 100%;order:-1;margin:0 0 4px;color:#ff5a5f;font-weight:600;line-height:1.35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ad-err{color:#b4232a}}
:root[data-theme="dark"] .ad-err{color:#b4232a}

/* Phones: one column; a church (or the merge panel) replaces the list, "‹ Lista" goes back */
@media (max-width:719.98px){
  .ad:is([data-page="churches"],[data-page="merge"])[data-view="church"] .ad-list{display:none}
  .ad:is([data-page="churches"],[data-page="merge"])[data-view="list"] .ad-main{display:none}
  .ad-back{display:inline-flex}
  .ad-ch{padding:12px 16px 0}
  .ad-cht{flex-basis:100%}
  .ad-tabs{padding:0 16px}
  .ad-tab{padding:0 10px}
  .ad-tab:first-child{margin-left:-10px}
  .ad-body{padding:16px}
  .ad-page{padding:16px}
  .ad-hist .ui-row{grid-template-columns:minmax(0,1fr)}}
/* Tablets and laptops: the rail on top, list and church side by side, each scrolling on its own */
@media (min-width:720px){
  .ad:not([data-page="login"]){height:100dvh;min-height:0;overflow:hidden;grid-template-columns:330px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .ad-rail{grid-column:1/-1}
  .ad-list{grid-column:1;grid-row:2;overflow-y:auto;border-right:1px solid var(--line)}
  .ad:not([data-page="login"]) .ad-main{grid-column:2;grid-row:2;overflow-y:auto}
  .ad:is([data-page="sugg"],[data-page="access"],[data-page="stats"]) .ad-main{grid-column:1/-1}
  .ad-bar.ui-savebar,.ad-toast.ui-toast{left:342px}}
@media (min-width:1100px){
  .ad:not([data-page="login"]){grid-template-columns:200px 330px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .ad-rail{grid-column:1;grid-row:1;flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:4px;padding:20px 12px 16px;border-bottom:0;border-right:1px solid var(--line);overflow-y:auto}
  .ad-logo{padding:0 12px 16px}
  .ad-nav.ui-tabbar{flex:none;flex-direction:column;gap:2px;max-width:none;padding:0;border:0}
  .ad-nav .ui-tab{flex:none;justify-content:space-between;padding:0 12px;border-radius:var(--r);text-align:left;box-shadow:none}
  .ad-nav .ui-tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:none}
  @media (hover:hover){.ad-nav .ui-tab:hover:not([aria-pressed="true"]){background:var(--sunken)}}
  .ad-me{flex-direction:column;align-items:flex-start;margin:auto 0 0;padding:0 12px}
  .ad-me .ui-btn{margin-left:-10px;min-height:36px}
  .ad-list{grid-column:2;grid-row:1}
  .ad:not([data-page="login"]) .ad-main{grid-column:3;grid-row:1}
  .ad:is([data-page="sugg"],[data-page="access"],[data-page="stats"]) .ad-main{grid-column:2/-1}
  .ad-bar.ui-savebar,.ad-toast.ui-toast{left:542px}}
@media (prefers-reduced-motion:reduce){.ad-it,.ad-tab,.ad-search{transition:none!important}}

/* Statisztika: anonymous usage counters (analytics_report) */
.st-page{max-width:1080px}
.st-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
#st-days button{white-space:nowrap}
.st-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 24px}
.st-tile{padding:12px 0 14px;border-top:1px solid var(--line);min-width:0}
.st-tile small{display:block;font:700 var(--fs-1)/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.st-tile b{display:block;margin-top:4px;font:300 var(--fs-mid)/1.05 var(--f-body);letter-spacing:-.03em;color:var(--ink)}
.st-tile span{display:block;margin-top:4px;font-size:var(--fs-1);color:var(--ink-3)}
.st-grid{display:grid;gap:0 40px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.st-wide{grid-column:1/-1}}
.st-box{padding:16px 0 20px;display:grid;gap:10px;align-content:start;min-width:0;border-top:1px solid var(--line)}
.st-box h2{margin:0;font:700 var(--fs-3)/1.25 var(--f-body)}
.st-box h3{margin:8px 0 0;font:700 var(--fs-1)/1.3 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.st-sub{margin:-6px 0 0;font-size:var(--fs-1);color:var(--ink-3)}
.st-chart{position:relative}
.st-chart svg{display:block;width:100%;height:auto;overflow:visible}
.st-chart .bar{fill:var(--ink);pointer-events:none}
.st-chart .hit{fill:transparent}
.st-chart .hit:hover + .bar,.st-chart .bar.on{fill:var(--ink-2)}
.st-chart .grid{stroke:var(--line);stroke-width:1}
.st-chart text{font:400 12px var(--f-body);fill:var(--ink-3);font-variant-numeric:tabular-nums}
.st-tip{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-100%);padding:5px 9px;border-radius:var(--r);background:var(--ink);color:var(--bg);font-size:var(--fs-1);white-space:nowrap}
.st-rows{display:grid}
.st-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:36px;padding:6px 8px;font-size:var(--fs-2);isolation:isolate}
.st-row::before{content:"";position:absolute;z-index:-1;inset:3px auto 3px 0;width:var(--w,0%);background:var(--accent-soft)}
.st-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .nm small{color:var(--ink-3);font-size:var(--fs-1)}
.st-row b{font-weight:600}
button.st-row{width:100%;border:0;background:none;color:inherit;font:inherit;font-size:var(--fs-2);text-align:left;cursor:pointer}
button.st-row:hover .nm{text-decoration:underline;text-underline-offset:3px}
.st-acts{font-size:var(--fs-1);color:var(--ink-3);white-space:nowrap}
.st-table{width:100%;border-collapse:collapse;font-size:var(--fs-1)}
.st-table th,.st-table td{padding:6px 8px;text-align:right;border-top:1px solid var(--line)}
.st-table th:first-child,.st-table td:first-child{text-align:left;padding-left:0}
.st-note{font-size:var(--fs-1);line-height:1.45;color:var(--ink-3);margin:0}
</style>
</head>
<body>
<div class="ad" id="app" data-page="login" data-view="list">
  <nav class="ad-rail" id="rail" aria-label="Adminisztráció" hidden>
    <p class="ad-logo">Harangszó<small>Adminisztráció</small></p>
    <div class="ad-nav ui-tabbar" role="group" aria-label="Részek">
      <button type="button" class="ui-tab" data-page="churches" aria-pressed="true"><span>Templomok</span><span class="ad-n" id="n-churches"></span></button>
      <button type="button" class="ui-tab" data-page="sugg" aria-pressed="false"><span>Javaslatok</span><span class="ad-badge" id="sugg-count"></span></button>
      <button type="button" class="ui-tab" data-page="access" aria-pressed="false"><span>Hozzáférések</span><span class="ad-badge" id="access-count"></span></button>
      <button type="button" class="ui-tab" data-page="merge" aria-pressed="false"><span>Összevonás</span></button>
      <button type="button" class="ui-tab" data-page="stats" aria-pressed="false"><span>Statisztika</span></button>
    </div>
    <div class="ad-me" id="who"></div>
  </nav>
  <section class="ad-list" id="listcol" aria-label="Templomok" hidden></section>
  <main class="ad-main" id="main"><p class="ad-loading">Betöltés…</p></main>
</div>
<div class="ui-savebar ad-bar" id="savebar" role="region" aria-label="Mentés">
  <span id="savestate" aria-live="polite"></span>
  <button class="ui-btn" id="bar-save" type="button">Mentés</button>
  <p class="ad-err" id="saveerr" role="alert" hidden></p>
</div>
<div class="ui-toast ad-toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="calendar.js"></script>
<script src="schedule-editor.js"></script>
<script src="admin.js"></script>
</body>
</html>
