<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harangszó</title>
<meta name="description" content="Katolikus templomok térképe Magyarországon: misék, gyóntatás, nyitvatartás, események.">
<meta name="theme-color" content="#23408e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <div id="map" role="application" aria-label="Magyarország térképe templomokkal"></div>

  <div class="topbar" id="topbar">
    <div class="toprow">
      <label class="qbar" for="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Templom vagy település" autocomplete="off" enterkeyhint="search"><span class="sr">Keresés</span></label>
      <button class="brandchip" id="menu-btn" aria-expanded="false" aria-controls="menu"><span aria-hidden="true">H</span><span class="sr">Menü</span></button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Szűrők"></div>
    <div class="maphint" id="maphint" role="status" hidden></div>
  </div>
  <div class="menu" id="menu" hidden>
    <p class="menu-name">Harangszó</p>
    <p class="menu-sub">templomok · misék · gyóntatás</p>
    <div class="notice" id="notice"></div>
    <div class="legend"><span><i class="mk mk-mass">18:00</i>mise</span><span><i class="mk mk-conf">17:30</i>gyóntatás</span><span><i class="mk mk-none">–</i>aznap nincs ismert alkalom</span></div>
    <a class="btn" href="plebania.html">Plébániáknak: miserend feltöltése</a>
  </div>

  <div class="ctrls" aria-label="Térkép vezérlői">
    <button class="cbtn" id="locate-btn" aria-label="Saját helyzetem"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <span class="csep" aria-hidden="true"></span>
    <button class="cbtn" id="zoom-in" aria-label="Nagyítás"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="cbtn" id="zoom-out" aria-label="Kicsinyítés"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  </div>

  <div class="dock" id="dock">
    <section class="nearest" id="nearest" aria-label="Legközelebb"></section>
    <nav class="ui-tabbar tabbar" aria-label="Nézetek">
      <button class="ui-tab" data-tab="map" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Térkép</span></button>
      <button class="ui-tab" data-tab="list" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg><span>Lista</span></button>
      <button class="ui-tab" data-tab="saved" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Mentett</span></button>
    </nav>
  </div>

  <section class="sheet" id="sheet" data-state="closed" aria-label="Templomok">
    <div class="grab" id="grab" role="button" tabindex="0" aria-label="Lap méretének váltása"><span></span></div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </section>
</div>
<dialog class="ui-sheet" id="filters" aria-labelledby="filters-h">
  <header><h2 id="filters-h">Szűrők</h2><button class="ui-btn quiet" id="filters-done" type="button">Kész</button></header>
  <div class="body" id="filters-body"></div>
</dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="calendar.js"></script>
<script src="app.js"></script>
</body>
</html>
