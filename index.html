<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harangszó</title>
<meta name="description" content="Katolikus templomok térképe Magyarországon: misék, gyóntatás, nyitvatartás, események.">
<meta name="theme-color" content="#23408e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Harangszó</h1><span>templomok · misék · gyóntatás</span></div>
    <nav class="views" aria-label="Hivatkozások">
      <a class="viewlink" href="admin.html">Szerkesztőknek</a>
    </nav>
  </header>
  <div class="notice" id="notice"></div>
  <div class="main">
    <section class="panel" id="panel" aria-live="polite"></section>
    <div class="mapwrap">
      <div id="map" role="application" aria-label="Magyarország térképe templomokkal"></div>
      <div class="maphint" id="maphint" role="status" hidden></div>
      <div class="legend"><span><i style="background:var(--penance)"></i>Gyóntatás a kiválasztott napon</span><span><i style="background:var(--accent)"></i>Mise</span><span><i style="background:var(--ink-3)"></i>Nincs ismert alkalom aznap</span></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="calendar.js"></script>
<script src="app.js"></script>
</body>
</html>
