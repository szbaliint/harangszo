<!doctype html>
<html lang="hu"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=Roboto+Serif:opsz,wght@8..144,600;8..144,700&family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#d9d6cf;padding:32px;color:#1d1a16;font-family:system-ui,sans-serif;
--bg:#f6f3ec;--surface:#fffdf8;--line:#e6dfd0;--ink3:#857c6c;--accent:#233f8c;--accent-soft:#e6e9f4;--violet:#6a2e8c;--violet-soft:#f0e6f4;--open:#1d7a4c;--open-soft:#e0f0e6}
h1{font:600 22px/1.2 system-ui;margin:0 0 4px}
.sub{color:#5b5447;margin:0 0 22px;font-size:14px;max-width:1100px}
.row{display:flex;gap:26px;align-items:flex-start}
.col{width:340px}
.col h2{font:600 15px system-ui;margin:0 0 4px}
.col .who{font-size:12.5px;color:#5b5447;margin:0 0 10px}
.p{background:var(--bg);border-radius:26px;padding:20px 16px;box-shadow:0 14px 40px rgb(0 0 0/.18)}
.p .tag{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;display:inline-block}
.p h3{margin:10px 0 2px;font-size:27px;line-height:1.12}
.p .ad{font-size:14px;color:var(--ink3)}
.hero{margin:14px 0 0;background:var(--accent);color:#fff;border-radius:20px;padding:14px 16px}
.hero small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero .t{font-size:44px;line-height:1;margin:4px 0 2px;font-variant-numeric:tabular-nums;font-weight:700}
.hero .w{font-size:14px;opacity:.9}
.list{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);font-size:15.5px}
.li:first-child{border-top:0}
.li .tm{font-weight:600;width:50px;font-variant-numeric:tabular-nums}
.li .k{flex:1}.li .k small{display:block;color:var(--ink3);font-size:13px}
.m{background:var(--accent-soft);color:var(--accent)}.c{background:var(--violet-soft);color:var(--violet)}.o{background:var(--open-soft);color:var(--open)}
.btn{margin-top:12px;height:46px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:15.5px}
.para{margin-top:12px;font-size:14.5px;line-height:1.5;color:#3d372e}
.n{font-size:13px;color:#5b5447;margin:10px 0 0;line-height:1.45}
/* A: native */
.A{font-family:Roboto,system-ui,sans-serif}.A h3{font-family:"Roboto Serif",ui-serif,Georgia,serif;font-weight:700;letter-spacing:-.015em}.A .hero .t{font-family:Roboto;font-weight:500}
/* B: Garamond + Source Sans */
.B{font-family:"Source Sans 3",system-ui,sans-serif}.B h3{font-family:"EB Garamond",Garamond,serif;font-weight:600;font-size:30px;letter-spacing:-.005em}.B .hero .t{font-family:"Source Sans 3";font-weight:600}
/* C: Alegreya pair */
.C{font-family:"Alegreya Sans",sans-serif}.C h3{font-family:Alegreya,serif;font-weight:700}.C .hero .t{font-family:"Alegreya Sans";font-weight:500}.C .li{font-size:16px}
</style></head><body>
<h1>Fonts · pick a pair (no Plex, no Spectral, no monospace)</h1>
<p class="sub">Same card in each. Times use the text font with even-width digits, so columns still line up. All three handle ő and ű properly.</p>
<div class="row">
<script>
const card = `<span class="tag o">Nyitva 17:00-ig</span>
<h3>Budavári Nagyboldogasszony-templom</h3><div class="ad">Szentháromság tér 2 · 640 m</div>
<div class="hero"><small>Következő mise</small><div class="t">18:00</div><div class="w">ma · magyar nyelvű</div></div>
<div class="list"><div class="li"><span class="tm">07:00</span><span class="k">Szentmise</span><span class="tag m">mise</span></div><div class="li"><span class="tm">17:00</span><span class="k">Gyóntatás<small>a sekrestyénél, gyóntató atya</small></span><span class="tag c">gyónás</span></div><div class="li"><span class="tm">18:30</span><span class="k">Szentségimádás</span></div></div>
<div class="para">Advent idején hétköznap reggel 6 órakor rorate szentmise. Ünnepnapokon a vasárnapi rend érvényes.</div>
<div class="btn">Útvonaltervezés</div>`;
const opts = [["A","A · Native app","Roboto Serif headings + system sans (shown here in Roboto; on iPhone the text is San Francisco)","Looks like a built-in phone app: neutral, very readable, zero download weight for the text. Least 'churchy'."],
["B","B · Classic church book","EB Garamond headings + Source Sans 3 text","Garamond is the face of missals and parish printing; Source Sans is a plain, sturdy text face. Traditional and warm, still clean. My pick."],
["C","C · Calligraphic","Alegreya + Alegreya Sans (a matched family)","Pen-drawn, humanist shapes with a hand-lettered warmth. Most distinctive; a bit more personality, slightly less neutral for admin tables."]];
document.write(opts.map(([k,t,w,n])=>`<div class="col"><h2>${t}</h2><p class="who">${w}</p><div class="p ${k}">${card}</div><p class="n">${n}</p></div>`).join(""));
</script>
</div></body></html>
