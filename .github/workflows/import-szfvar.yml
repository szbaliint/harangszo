name: Import Székesfehérvár diocese schedule

# Run manually from the Actions tab. Downloads the diocese's Mass schedule
# (https://www.szfvar.katolikus.hu/adattar/miserend), matches each church to the database and updates its
# regular times. Churches with hand-entered times or locked by an editor are left alone.
# The full report appears on the run's summary page and as the "report" artifact.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would happen (recommended first)"
        type: boolean
        default: true
      force:
        description: "Also overwrite hand-entered times (locked churches are still skipped)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Import
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node import-szfvar.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: |
            scripts/report.md
            scripts/report.json
          if-no-files-found: ignore
