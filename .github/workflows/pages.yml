name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Insert Google Maps key (if the secret is set)
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          mkdir -p _site
          cp index.html styles.css app.js data.js config.js _site/
          if [ -n "$GOOGLE_MAPS_KEY" ]; then
            sed -i "s|__GOOGLE_MAPS_KEY__|${GOOGLE_MAPS_KEY}|" _site/config.js
            echo "Google Maps key inserted."
          else
            echo "No GOOGLE_MAPS_KEY secret; the site will use OpenStreetMap."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
